async function save(){
  if(!sel.store){flash("Choisissez un resto.");return}
  const rows=[];let bad=0;
  for(const [ref,v] of Object.entries(bulk[sel.store]||{})){
    if(String(v).trim()==="")continue;
    const q=Number(String(v).trim().replace(",","."));
    if(!Number.isInteger(q)||q<0){bad++;continue}
    rows.push({store_id:sel.store,product_id:ref,qty:q});
  }
  if(bad){flash(bad+" valeur(s) invalide(s) : entiers ≥ 0 uniquement.");return}
  if(!rows.length){flash("Aucune valeur saisie : rien n’a été modifié.");return}
  busy=true;
  try{
    await sb.from("stk_readings").insert(rows).throwOnError();
    recent.unshift(`${fdt(Date.now())} · ${S.stores[sel.store].name} : ${rows.length} produit(s) mis à jour`);recent=recent.slice(0,5);

const PR={cur:null,hist:null,q:"",multi:true,per:"3m",from:"",to:"",mode:"var",sort:"vdesc",vg:"all",sup:"",csup:"",cvg:"all",tag:"",loading:false}; // mode : "var" = variations des articles (par défaut), "comp" = comparateur fournisseurs

// Période d'observation des variations : semaine, mois, personnalisée…

function prRange(){const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=(d0.getDay()+6)%7,mon=new Date(d0.getTime()-dow*DAY),E=t=>t+DAY-1;

  case"mois":return[new Date(now.getFullYear(),now.getMonth(),1).getTime(),now.getTime()];

  case"perso":{const a=PR.from?Date.parse(PR.from+"T00:00:00"):Date.parse("2026-09-01T00:00:00"),b=PR.to?E(Date.parse(PR.to+"T00:00:00")):now.getTime();return[a,b]}

  if(ref===cur||!(val(ref)>0))return null;return{from:ref,to:cur,a:val(ref),b:val(cur),v:val(cur)/val(ref)-1}}

function histBlock(x){const val=o=>Number(o.price_per_unit)>0?Number(o.price_per_unit):Number(o.unit_price);
  const all=PR.hist.filter(o=>o.supplier_product_id===x.supplier_product_id).sort((a,b)=>a.at<b.at?-1:1),hs=[];

async function addProd(){

async function forceSync(){

  try{const {data,error}=await sb.functions.invoke("yokitup-sync",{body:{full:true}});

    busy=false;await loadAll();PR.cur=null;if(view==="prix")loadPrix();flash(`Synchro terminée ✓ ${data&&data.readings!=null?`· ${data.readings} stock(s) mis à jour`:""}${data&&data.prix&&data.prix.tarifs_modifies!=null?` · ${data.prix.tarifs_modifies} tarif(s) modifié(s)`:""}`);
  }catch(e){busy=false;await loadAll();flash("Échec de la synchro : "+(e.message||"erreur"))}
}

const okReq=i=>{const r=S.requests[i];r&&run(()=>sb.rpc("stk_set_member",{p_email:r.email,p_role:"manager"}).throwOnError(),"Accès accordé ✓")};
const noReq=i=>{const r=S.requests[i];r&&run(()=>sb.from("stk_requests").delete().eq("user_id",r.user_id).throwOnError())};
async function addMember(){const e=memEmail.trim();if(!e)return;const {error}=await sb.rpc("stk_set_member",{p_email:e,p_role:"manager"});memMsg=error?"Échec : "+error.message:"Enregistré : si le compte existe, l’accès est accordé.";if(!error)memEmail="";await loadAll();render(true)}

/* ---------- Noyau ---------- */
function render(force){
  if(!sess){loginView();return}
  if(view==="ventes"){view="stats"}if(view==="gest"&&!isOwner||view==="stats"&&!canStats())view="dash";document.body.classList.toggle("wide",view==="stats");if(view==="prix"&&!canP)view="dash";if(view==="saisie"&&!canSaisie())view="dash";
  const sig=view==="saisie"?"s"+JSON.stringify([S.stores,S.lines,S.products,curP,S.readings.length]):Math.random();
  if(!force&&view==="saisie"&&sig===lastSig)return;
  lastSig=sig;
  shell(view==="dash"?dash():view==="gest"?gest():view==="stats"?statsView():view==="prix"?prix():saisie());
}
let sb,sess=null,started="",loginErr="",tm,memEmail="",memMsg="";
// Chargement : toutes les requêtes partent en même temps ; la dernière version reçue est gardée sur l'appareil
// pour afficher le tableau de bord tout de suite à l'ouverture suivante, puis il est rafraîchi.
async function fetchRaw(){
  const q=t=>sb.from(t).select("*");
  const reqs=[q("stk_stores"),q("stk_products"),q("stk_lines"),q("stk_periods"),q("stk_latest_readings"),q("stk_obs"),q("stk_weekly"),sb.from("stk_yk_state").select("last_sync,last_error,stats").eq("id",1).maybeSingle()];
  if(isOwner)reqs.push((async()=>{for(const c of["id,name,role,store_id,custom_role_id","id,name,role,store_id","id,name,role"]){const r=await sb.from("stk_profiles").select(c);if(!r.error)return r}return {data:[]}})(),q("stk_requests"),sb.from("stk_lab_suppliers").select("name"));
  // stock du Laboratoire : lisible seulement par les admins et le labo (les managers ne le reçoivent jamais)
  const [r,dv,lb]=await Promise.all([Promise.all(reqs),sb.from("stk_deliveries").select("store_id,day"),canL?sb.from("stk_lab_stock").select("product_id,qty,fiches,updated_at"):Promise.resolve({data:null})]); // dates de livraison de l'agenda Google
  const bad=r.slice(0,4).find(x=>x.error);if(bad)return {err:bad.error.message};
  const d=r.map(x=>x.data);
  return {st:d[0],pr:d[1],ln:d[2],pe:d[3],rd:d[4],ob:d[5],po:d[6],ys:d[7],pf:d[8],rq:d[9],ls:d[10],dv:dv.error?[]:dv.data||[],dvErr:!!dv.error,lb:lb.error?null:lb.data};
}
function applyRaw(R){
  S.stores=Object.fromEntries(R.st.map(r=>[r.id,{name:r.name,min:Number(r.min_month)||0,dd:Number(r.delivery_days)||0,last:r.last_delivery||""}]));
  S.delivOk=!R.dvErr;S.deliv={};for(const r of R.dv||[])(S.deliv[r.store_id]=S.deliv[r.store_id]||[]).push(Date.parse(r.day+"T00:00:00"));for(const k in S.deliv)S.deliv[k].sort((a,b)=>a-b);
  S.products=Object.fromEntries(R.pr.map(r=>[r.id,{name:r.name,key:r.key}]));
  S.lab=canL&&R.lb?Object.fromEntries(R.lb.map(r=>[r.product_id,{q:Math.max(0,Number(r.qty)||0),f:r.fiches||"",at:r.updated_at}])):null;
  S.lines=Object.fromEntries(R.ln.map(r=>[r.id,{period:r.period_id,store:r.store_id,ref:r.product_id,group:r.grp,monthly:Number(r.monthly)}]));
  S.periods=Object.fromEntries(R.pe.map(r=>[r.id,{name:r.name,end:r.end_date,launch:r.launch_date,cover:Number(r.cover),fixed:r.fixed===true}]));
  for(const l of Object.values(S.lines))l.group=isFix(l.period)?"perm":"per"; // ★ fixe : couverture du stock ; saisonnière : stock bas à la fin du trimestre
  S.pos=Object.fromEntries((R.po||[]).map(r=>[r.store_id+"__"+r.product_id,{weeks:(r.weeks||[]).map(Number),first:Date.parse(r.first_week+"T00:00:00")}]));
  // Stock Yokitup inchangé depuis le dernier relevé : il reste valable jusqu'à la dernière synchro
  {const prevSync=S.ykState&&S.ykState.last_sync;S.ykState=R.ys||null;if(prevSync&&S.ykState&&S.ykState.last_sync!==prevSync&&PR.cur!=null){PR.cur=null;if(view==="prix")setTimeout(loadPrix,0)}} // nouvelle synchro : on recharge les prix
  const ls=R.ys&&R.ys.last_sync?Date.parse(R.ys.last_sync):0;
  ykOk=!!ls&&!R.ys.last_error&&Date.now()-ls<YK_OK_H*36e5;
  S.readings=(R.rd||[]).map(r=>{const ts=Date.parse(r.created_at),y=r.source==="yokitup"&&S.pos[r.store_id+"__"+r.product_id];
    return {store:r.store_id,ref:r.product_id,qty:Math.max(0,Number(r.qty)||0) /* stock négatif affiché à 0 */,ts:y&&ls>ts?ls:ts,by:r.source==="import"?"import":r.source==="yokitup"?"yokitup":r.user_id}});
  S.obs=Object.fromEntries((R.ob||[]).map(r=>[r.store_id+"__"+r.product_id,{sold:Number(r.sold),days:Number(r.days)}]));
  if(isOwner&&R.pf){
    S.labSup=(R.ls||[]).map(r=>r.name).sort((a,b)=>a.localeCompare(b,"fr"));
    S.members=R.pf||[];S.members.forEach(p=>S.names[p.id]=p.name||"Collaborateur");S.requests=R.rq||[];
  }
}
const CK=()=>"stk_cache_"+me;
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CK())||"null");if(c&&c.st){applyRaw(c);autoP();render();return true}}catch(e){}return false}
async function loadAll(){
  for(const k in REL)delete REL[k]; // relevés de l’onglet Ventes moyennes rechargés après chaque mise à jour
  if(view==="prix"){PR.cur=null} // prix rechargés à l’affichage
  const R=await fetchRaw();
  if(R.err){if(!S.stores||!Object.keys(S.stores).length)$("#app").innerHTML=`<div class="card err">Accès aux données impossible : ${esc(R.err)}</div>`;return}
  applyRaw(R);try{localStorage.setItem(CK(),JSON.stringify(R))}catch(e){}
  if(isOwner){const [c,ro]=await Promise.all([sb.from("stk_settings").select("key,value"),sb.from("stk_roles").select("*").order("name")]);S.cfg=c.error?null:Object.fromEntries((c.data||[]).map(x=>[x.key,x.value||""]));S.roles=ro.error?null:ro.data||[];
    S.zelty=await loadZelty();
    if(S.roles&&!rolesDepartOk())await convertBaseRoles()}
  autoP();render();
}
const sched=()=>{clearTimeout(tm);tm=setTimeout(loadAll,1500)}; // plusieurs changements d’affilée (synchro) = un seul rechargement
let signup=false,loginInfo="";
function loginView(){
  $("#app").innerHTML=`<div style="text-align:right;margin-bottom:8px">${langSw()}</div><div class="card"><h1 style="margin-bottom:6px">Suivi des stocks</h1><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Mot de passe${signup?" (8 caractères minimum)":""}</label><div class="pw"><input id="pw" type="password" autocomplete="${signup?"new-password":"current-password"}" onkeydown="if(event.key==='Enter')login()"><button type="button" class="eye" title="Afficher le mot de passe" onclick="togPw(this)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="btn" onclick="login()">${signup?"Créer mon compte":"Se connecter"}</button><div class="msg err">${esc(loginErr)}</div><div class="msg">${esc(loginInfo)}</div><div class="sub" style="margin-top:12px;text-align:center;cursor:pointer;text-decoration:underline" onclick="signup=!signup;loginErr='';loginInfo='';loginView()">${signup?"J’ai déjà un compte":"Créer un compte"}</div>${signup?"":`<div class="sub" style="margin-top:8px;text-align:center;cursor:pointer;text-decoration:underline" onclick="forgotPw()">Mot de passe oublié ?</div>`}</div>`;
}
async function login(){
  const em=$("#em").value.trim(),pw=$("#pw").value;
  if(signup){
    if(pw.length<8){loginErr="Mot de passe trop court (8 caractères minimum).";loginView();return}
    const {data,error}=await sb.auth.signUp({email:em,password:pw});
    if(error){loginErr="Erreur : "+error.message;loginView();return}
    if(data.session)return;
    signup=false;loginErr="";loginInfo="Compte créé. Si un e-mail de confirmation vous est envoyé, cliquez sur le lien, puis connectez-vous. L’admin devra valider votre accès.";loginView();return;
  }
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){loginErr=/invalid login/i.test(error.message)?"E-mail ou mot de passe incorrect.":"Erreur : "+error.message;loginView()}
}
// Afficher / masquer le mot de passe (petit œil)
function togPw(b){const i=b.parentNode.querySelector("input");const v=i.type==="password";i.type=v?"text":"password";b.classList.toggle("on",v);b.title=T(v?"Masquer le mot de passe":"Afficher le mot de passe")}
// Lien de réinitialisation envoyé par e-mail (le lien ramène sur l'appli, qui demande le nouveau mot de passe)
const RESET_URL=location.origin+location.pathname;
async function sendReset(em){const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:RESET_URL});return error}
async function forgotPw(){const em=$("#em").value.trim();if(!em){loginErr="Saisissez d’abord votre e-mail.";loginInfo="";loginView();return}
  const e=await sendReset(em);loginErr=e?"Erreur : "+e.message:"";loginInfo=e?"":"Un e-mail vous a été envoyé : cliquez sur le lien pour choisir un nouveau mot de passe.";loginView();$("#em").value=em}
let recovering=false;
function newPwView(msg=""){$("#app").innerHTML=`<div style="text-align:right;margin-bottom:8px">${langSw()}</div><div class="card"><h1 style="margin-bottom:6px">Nouveau mot de passe</h1><label>Nouveau mot de passe (8 caractères minimum)</label><div class="pw"><input id="np" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')saveNewPw()"><button type="button" class="eye" title="Afficher le mot de passe" onclick="togPw(this)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="btn" onclick="saveNewPw()">Enregistrer</button><div class="msg err">${esc(msg)}</div></div>`}
async function saveNewPw(){const pw=$("#np").value;if(pw.length<8){newPwView("Mot de passe trop court (8 caractères minimum).");return}
  const {error}=await sb.auth.updateUser({password:pw});if(error){newPwView("Erreur : "+error.message);return}
  recovering=false;toast="Mot de passe modifié ✓";history.replaceState(null,"",RESET_URL);started="";if(sess){started=sess.user.id;start()}}
async function resetMember(id){const m=S.members.find(x=>x.id===id);const def=m&&/@/.test(m.name||"")?m.name:"";
  const em=(prompt("E-mail du compte à réinitialiser :",def)||"").trim();if(!em)return;
  const e=await sendReset(em);flash(e?"Erreur : "+e.message:"Lien de réinitialisation envoyé à "+em+" ✓")}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  me=sess.user.id;
  // Rôle et données de la dernière visite : affichage immédiat, puis vérification en ligne
  let cr="";try{cr=localStorage.getItem("stk_role_"+me)||""}catch(e){}
  if(cr){let pc=null;try{pc=JSON.parse(localStorage.getItem("stk_perm_"+me)||"null")}catch(e){}setPerms(cr,pc&&pc.st,pc&&pc.cr);canDash=true;view="dash";loadCache()}
  let {data,error:pe}=await sb.from("stk_profiles").select("role,store_id,custom_role_id").eq("id",me).maybeSingle();
  if(pe)({data,error:pe}=await sb.from("stk_profiles").select("role,store_id").eq("id",me).maybeSingle()); // colonnes pas encore créées
  if(pe)({data}=await sb.from("stk_profiles").select("role").eq("id",me).maybeSingle());
  if(data)try{localStorage.setItem("stk_role_"+me,String(data.role||"").toLowerCase())}catch(e){}
  if(!data){try{localStorage.removeItem("stk_role_"+me);localStorage.removeItem("stk_cache_"+me)}catch(e){}isOwner=isLabo=canDash=false;await sb.from("stk_requests").upsert({user_id:me,email:sess.user.email},{onConflict:"user_id",ignoreDuplicates:true});$("#app").innerHTML=`<div class="card"><b>En attente de validation</b><p class="sub">Votre compte est créé. L’admin doit maintenant valider votre accès. Revenez plus tard.</p><button class="btn" onclick="logout()">Se déconnecter</button></div>`;return}
  const rl=String(data.role||"").toLowerCase();let crow=null;
  if(data.custom_role_id&&rl!=="admin"){const {data:r}=await sb.from("stk_roles").select("*").eq("id",data.custom_role_id).maybeSingle();crow=r||null}
  setPerms(rl,data.store_id,crow);canDash=true;try{localStorage.setItem("stk_perm_"+me,JSON.stringify({st:data.store_id||"",cr:crow}))}catch(e){}if(!cr)view="dash";
  if(!cr)loadCache(); // affichage immédiat avec les dernières données connues
  await loadAll();
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public"},sched).subscribe();
}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange((e,s)=>{sess=s;if(e==="PASSWORD_RECOVERY"||recovering){recovering=e==="PASSWORD_RECOVERY"||recovering;if(s){newPwView();return}}if(!s){started="";loginView();return}if(started!==s.user.id){started=s.user.id;setTimeout(start,0)}});
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
